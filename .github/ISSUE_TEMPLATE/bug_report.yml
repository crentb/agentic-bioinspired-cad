name: Bug report
description: Something produces a wrong result, crashes, or does not match the documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security issues; see SECURITY.md for private reporting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Generators (helicoidal / woven / enamel)
        - Agent loop (code emitter, Blender runner, critic, repair, manufacturability gate)
        - Printing (print audit, FDM variants, remeshing)
        - FEA (voxel-hex mesh, linear / finite-strain tension, damage tolerance)
        - Fracture (MOOSE decks, analysis, rendering)
        - Packaging, CI, container
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact command, the parameters, and the expected vs. observed result (numbers where relevant).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest command sequence or input that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, abcad version, and where relevant the Blender / SfePy / MOOSE / Ollama versions and which interpreter ran the command.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or tracebacks
      render: text
