# =============================================================================
# CodeQL semantic code scanning (SAST beyond bandit).
#
# Two languages are analyzed with the `security-extended` query suite:
#   python  -- the shipped package (taint tracking: command/code injection,
#              path traversal, unsafe deserialization, ...), complementing the
#              pattern-based bandit gate in ci.yml;
#   actions -- the workflows in .github/workflows themselves (expression
#              injection, untrusted checkout, excessive permissions), because
#              the CI/CD pipeline is part of the attack surface.
# Findings appear under the repository's Security -> Code scanning tab.
#
# Code scanning is free for public repositories only, so a tiny `visibility`
# job runs first and the analysis is skipped (not failed) while the repository
# is private. It activates automatically once the repository is public.
# =============================================================================
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 06:41 UTC: re-analysis picks up newly added queries.
    - cron: "41 6 * * 3"

permissions:
  contents: read

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      public: ${{ steps.v.outputs.public }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        # Works for every trigger (the schedule event payload carries no
        # repository object, so the visibility is asked of the API instead).
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')
          if [ "${private}" = "false" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
      actions: read # read workflow run metadata for the analysis
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none # interpreted languages: no build step is needed
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
