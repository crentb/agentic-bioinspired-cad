# =============================================================================
# OpenSSF Scorecard: automated supply-chain security posture assessment.
#
# Scores this repository against the OpenSSF checks (pinned dependencies,
# token permissions, branch protection, dangerous-workflow patterns, signed
# releases, SAST, vulnerability disclosure policy, ...). Results are published
# to the public Scorecard API (which backs the README badge) and uploaded to
# the Security -> Code scanning tab as SARIF.
#
# Scorecard publishing is supported for public repositories only, so the
# analysis is skipped (not failed) while the repository is private.
#
# Workflow restrictions required by `publish_results: true`: no top-level env
# or defaults, read-only top-level permissions, and only the allow-listed
# actions (checkout, scorecard, upload-artifact, upload-sarif) in the job that
# runs Scorecard.
# =============================================================================
name: OpenSSF Scorecard

on:
  # Re-score when branch protection changes, weekly, and on pushes to main.
  branch_protection_rule:
  schedule:
    - cron: "29 7 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      public: ${{ steps.v.outputs.public }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')
          if [ "${private}" = "false" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the Scorecard API (backs the badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
